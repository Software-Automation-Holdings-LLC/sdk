# Goes to .trunk/trunk.yaml in the product repo. Org metalint rules live in dev-config
# plugin.yaml; trunk-io/plugins supplies linter definitions. Renovate bumps the trunk-io ref; `release-scaffold` updates the dev-config SHA pin.
version: 0.1
cli:
  version: 1.22.8
plugins:
  sources:
    - id: trunk
      ref: v1.6.7
      uri: https://github.com/trunk-io/plugins
    - id: org
      ref: f973bb30e3299044dd81424593f06cac8876000d # v1
      uri: https://github.com/Software-Automation-Holdings-LLC/dev-config
