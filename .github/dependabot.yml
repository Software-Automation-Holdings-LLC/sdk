version: 2
updates:
  - package-ecosystem: composer
    directory: /packages/php
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types: [minor, patch]
