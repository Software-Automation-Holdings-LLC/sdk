# Thin caller -> dev-config automerge-guard reusable.
# When an operator removes `safe-automerge`, GitHub auto-merge is disabled.
name: automerge-guard

on:
  pull_request_target:
    types: [unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'safe-automerge'
    uses: Software-Automation-Holdings-LLC/dev-config/.github/workflows/automerge-guard.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      removed_label: ${{ github.event.label.name }}
