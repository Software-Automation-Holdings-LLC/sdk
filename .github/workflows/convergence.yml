# Thin caller -> dev-config review-coordinator. Dispatches Devin convergence for
# security PRs, bot-authored PRs, PRs with Cursor attribution in the body, and PRs
# labeled `agent:converge`. Unresolved-thread merge blocking is org-ruleset policy
# (required_review_thread_resolution), not a per-repo action; convergence only keeps
# Devin from declaring done early via wait_for_reviews_to_settle() in converge.py.
#
# Wake on every shape a finding can arrive in for in-scope PRs:
#   * reviewer SUBMITS a review -> run LAST behind the bots;
#   * review-thread COMMENT without a submitted review;
#   * PR-level ISSUE COMMENT (e.g. CodeRabbit summary);
#   * PR opened / ready / synchronized (bot or security label);
#   * `agent:converge` or `security` label added;
#   * `agent:pause` label removed (budget restore resume);
#   * PR closed/merged (archive tied Devin sessions; no nudge);
#   * required check failed on a PR head (re-fire when CI/OpenTofu is red).
name: convergence

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  check_run:
    types: [completed]
  pull_request_target:
    types: [opened, ready_for_review, synchronize, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Always runs so downstream jobs are not skipped when the event is not issue_comment.
  fork-guard:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.check.outputs.is_fork }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            is_fork=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.repo.full_name != .base.repo.full_name')
          else
            is_fork=false
          fi
          echo "is_fork=${is_fork}" >> "$GITHUB_OUTPUT"

  scope:
    needs: [fork-guard]
    if: >-
      !cancelled() &&
      needs.fork-guard.result != 'failure' &&
      ((github.event.action == 'closed' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name == 'pull_request_review' ||
         github.event_name == 'pull_request_review_comment' ||
         (github.event_name == 'pull_request_target' &&
          ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
           (github.event.action == 'labeled' &&
            (github.event.label.name == 'agent:converge' ||
             github.event.label.name == 'security')) ||
           (github.event.action == 'unlabeled' &&
            github.event.label.name == 'agent:pause')))) ||
       (github.event_name == 'check_run' &&
        github.event.check_run.pull_requests[0] != null &&
        (github.event.check_run.pull_requests[0].head.repo == null ||
         github.event.check_run.pull_requests[0].head.repo.full_name == github.repository) &&
        github.event.check_run.pull_requests[0].base.repo.full_name == github.repository &&
        contains(fromJSON('["failure","cancelled","timed_out","action_required"]'), github.event.check_run.conclusion)) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        needs.fork-guard.result == 'success' &&
        needs.fork-guard.outputs.is_fork != 'true' &&
        github.event.sender.login != 'sah-dev-bot[bot]' &&
        !startsWith(github.event.comment.body, '<!-- sah:convergence-round')))
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Mint sah-dev-bot token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.DEV_BOT_APP_ID }}
          private-key: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dev-config

      - name: Fetch scope checker from dev-config
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Software-Automation-Holdings-LLC/dev-config
          ref: v1
          sparse-checkout: review
          sparse-checkout-cone-mode: true
          token: ${{ steps.token.outputs.token }}

      - name: Check convergence scope
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number }}
        run: |
          eligible=$(python3 review/convergence_scope.py --repo "${GITHUB_REPOSITORY}" --pr "${PR_NUMBER}")
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

  converge:
    needs: [fork-guard, scope]
    if: >-
      !cancelled() &&
      needs.fork-guard.result != 'failure' &&
      needs.scope.outputs.eligible == 'true'
    uses: Software-Automation-Holdings-LLC/dev-config/.github/workflows/review-coordinator.yml@a75954a749a8e3a98f9eba2f84dd1821951a627c  # v1
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number }}
      config_ref: ${{ github.event.pull_request.head.sha || github.event.check_run.pull_requests[0].head.sha || 'v1' }}
