# Thin caller -> dev-config advisory-suite. One pin runs all advisory PR checks.
name: advisory-suite

on:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    permissions:
      contents: read
      pull-requests: write
    uses: Software-Automation-Holdings-LLC/dev-config/.github/workflows/advisory-suite.yml@main # sprint: tracks main
    secrets:
      DEV_BOT_APP_ID: ${{ secrets.DEV_BOT_APP_ID }}
      DEV_BOT_PRIVATE_KEY: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
