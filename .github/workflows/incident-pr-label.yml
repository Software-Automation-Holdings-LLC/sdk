# Thin caller -> dev-config incident-pr-label reusable.
name: incident-pr-label

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: Software-Automation-Holdings-LLC/dev-config/.github/workflows/incident-pr-label.yml@a75954a749a8e3a98f9eba2f84dd1821951a627c # v1
    secrets:
      DEV_BOT_APP_ID: ${{ secrets.DEV_BOT_APP_ID }}
      DEV_BOT_PRIVATE_KEY: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
