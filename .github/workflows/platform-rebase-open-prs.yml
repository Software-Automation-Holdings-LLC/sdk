# After platform work merges to main, refresh automation-owned open PRs so CI
# runs against the current base (scaffold pointers, workflow callers, dev-config pin).
name: platform-rebase-open-prs

on:
  schedule:
    # Every 3 hours: sweeps DIRTY PRs that piled up before this cron existed (the
    # push+path trigger only fires on new platform merges, leaving the 49-PR backlog
    # untouched between pushes). 3 h gives Devin time to make progress between runs
    # while keeping the backlog gap well under a business day.
    - cron: "0 */3 * * *"
  push:
    branches:
      - main
      - master
    # Only org/scaffold pointer changes affect bot PR CI bases — not every app merge.
    paths:
      - lefthook.yml
      - renovate.json
      - .trunk/trunk.yaml
      - .github/pull_request_template.md
      - .prettierignore
      - .github/workflows/advisory-suite.yml
      - .github/workflows/convergence.yml
      - .github/workflows/platform-rebase-open-prs.yml
      - .github/workflows/security-migration.yml
      - .github/workflows/safe-class-approve.yml
      - .github/workflows/security-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-rebase-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint sah-dev-bot token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.DEV_BOT_APP_ID }}
          private-key: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},dev-config

      - name: Fetch rebase helper from dev-config
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Software-Automation-Holdings-LLC/dev-config
          ref: f973bb30e3299044dd81424593f06cac8876000d # v1
          sparse-checkout: review/
          sparse-checkout-cone-mode: false
          token: ${{ steps.token.outputs.token }}

      - name: Rebase bot-scoped open PRs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Devin keys are optional: if absent the script skips conflict dispatch and
          # logs a warning; clean-rebase and out-of-scope needs-human paths still run.
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        run: python3 review/rebase_open_prs.py --repo "${{ github.repository }}" --execute
