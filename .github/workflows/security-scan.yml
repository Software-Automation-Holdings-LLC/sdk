name: security-scan

# Calls the platform security-scan reusable: scanners run report-only, findings
# are deduped to Linear, and high/critical units are delegated to Devin.
on:
  pull_request:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  pull-requests: write # reusable reconcile step closes stale security PRs

jobs:
  scan:
    # permissions: is NOT allowed at the job level when the job calls a reusable
    # workflow via `uses:`. GitHub validates and rejects the file before any job
    # runs, producing "This run likely failed because of a workflow file issue".
    # Workflow-level permissions (above) are inherited by the reusable caller.
    uses: Software-Automation-Holdings-LLC/dev-config/.github/workflows/security-scan.yml@v1
    secrets:
      DEV_BOT_APP_ID: ${{ secrets.DEV_BOT_APP_ID }}
      DEV_BOT_PRIVATE_KEY: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
