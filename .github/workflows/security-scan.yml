name: security-scan

# Calls the platform security-scan reusable: scanners run report-only, findings
# are deduped to Linear, and high/critical units are delegated to Devin.
on:
  pull_request:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  pull-requests: write # reusable reconcile step closes stale security PRs

jobs:
  scan:
    permissions:
      contents: read
      security-events: read
      pull-requests: write # reusable reconcile step closes stale security PRs
    uses: Software-Automation-Holdings-LLC/dev-config/.github/workflows/security-scan.yml@d421892f7c31b03c35a4fab8d30208d3c6dba199 # v1
    secrets:
      DEV_BOT_APP_ID: ${{ secrets.DEV_BOT_APP_ID }}
      DEV_BOT_PRIVATE_KEY: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
