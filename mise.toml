# Platform contract for the unified Go SDK mirror.
#
# DISPOSITION: generated mirror — ADR-035 (SDK Mirror Distribution) +
# SAH_DEVOPS_STRATEGY.md §12 ("Generated"). The entire Go module
# (core/zyins/rapidsign/proxy/account/catalog/contract/...) is auto-published from
# isa-platform/packages/go on every `sdk/<product>/v*` release tag; manual edits are
# overwritten by the next publish. The source, the generator, the full
# unit/conformance/cross-SDK-parity suites, and the regeneration-diff gate all live
# UPSTREAM in isa-platform — that is where the code is editable and where the monorepo
# parity fixtures (tests/conformance/*, shared/schemas/sdk/testdata/*) actually exist.
#
# This repo's gate therefore validates the one thing a mirror owns: that the published
# tree BUILDS, VETS, and IMPORTS cleanly — the in-mirror smoke build ADR-035 step 5
# prescribes. It deliberately does NOT re-run the source's fixture-dependent suites
# (they execute upstream in isa-platform's sdk-conformance.yml / sdk-go.yml against the
# real fixtures), and it does NOT reformat or style-lint immutable published artifacts
# (that is owned upstream where the source is editable).

[tools]
go = "1.26.4"

[tasks.setup]
description = "Download module dependencies."
run = "go mod download"

[tasks.lint]
description = "Build-correctness static analysis (go vet). Style/format linting is owned upstream where the source is editable (generated mirror)."
depends = ["setup"]
run = "go vet ./..."

[tasks.test]
description = "Compile and typecheck the whole published tree, test sources included, executing zero tests. The unit/conformance/cross-SDK-parity suites of record run UPSTREAM in isa-platform against the monorepo fixtures (ADR-035)."
depends = ["setup"]
run = "go test -run '^$' ./..."

[tasks.build]
description = "Compile every package — the consumer importability contract and the ADR-035 in-mirror smoke build."
depends = ["setup"]
run = "go build ./..."

[tasks.scan]
description = "Go vulnerability scan. Advisories route to Linear via security-scan.yml on the remediation-SLA model (§7); secret-blocking is lefthook at commit plus GitHub push protection."
depends = ["setup"]
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./... || true"

[tasks.doctor]
description = "Cheap platform-contract check: mise.toml present and the universal verbs exist."
run = '''
test -f mise.toml
list=$(mise tasks ls)
for v in setup lint test scan build doctor ci; do
  echo "$list" | grep -q "^$v" || { echo "missing task: $v"; exit 1; }
done
echo "platform contract OK"
'''

[tasks.ci]
description = "The full mirror gate: build-correctness (lint) + tree-compiles (test) + importability (build) + vuln scan."
depends = ["lint", "test", "build", "scan"]
